name: Build apps
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pywebview pyinstaller
      - name: Cliente
        run: pyinstaller --noconfirm --windowed --name "RemoteDesk-Cliente" --collect-all aiortc --collect-all av --collect-all pyautogui apps/client_app.py
      - name: Tecnico
        run: pyinstaller --noconfirm --windowed --name "RemoteDesk-Tecnico" apps/tech_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-${{ matrix.os }}
          path: dist/
