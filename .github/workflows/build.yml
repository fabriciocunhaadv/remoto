name: Build apps
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pywebview pyinstaller
      - name: Cliente
        run: pyinstaller --noconfirm --windowed --name "RemoteDesk-Cliente" --paths agent --paths apps --hidden-import agent --hidden-import config --collect-all aiortc --collect-all av --collect-all pyautogui --collect-submodules pystray --collect-all pyperclip apps/client_app.py
      - name: Tecnico
        run: pyinstaller --noconfirm --windowed --name "RemoteDesk-Tecnico" --paths apps --hidden-import config apps/tech_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compactar
        run: |
          (cd artifacts/RemoteDesk-windows-latest && zip -qr ../../RemoteDesk-Windows.zip .)
          (cd artifacts/RemoteDesk-macos-latest && zip -qry ../../RemoteDesk-Mac.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RemoteDesk (última versão)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: RemoteDesk-*.zip
