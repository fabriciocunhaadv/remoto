<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoteDesk</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #login{max-width:480px;margin:6vh auto;padding:16px}
  h2{margin:0 0 14px}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;background:#222;color:#aaa}
  .tabs button.on{background:#2f7df6;color:#fff}
  .panel{display:none;gap:10px}
  .panel.on{display:grid}
  input,button{padding:10px;font-size:16px;border-radius:6px;border:0}
  button{background:#2f7df6;color:#fff;cursor:pointer}
  button:disabled{background:#333;color:#777;cursor:default}
  button.ghost{background:#2a2a2a;color:#ccc;padding:6px 10px;font-size:13px}
  #err{color:#f66;min-height:1.2em;margin-top:10px}
  .row{display:flex;align-items:center;gap:10px;background:#1b1b1b;border-radius:8px;padding:10px 12px}
  .row .info{flex:1;min-width:0}
  .row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sub{font-size:12px;color:#888}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;flex:none}
  .dot.on{background:#3ddc84}
  .empty{color:#888;font-size:14px;line-height:1.5}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  #screen{display:none;width:100vw;height:100vh;object-fit:contain;background:#000;outline:none}
  #bye{display:none;position:fixed;top:8px;right:8px;z-index:5;opacity:.6;padding:6px 12px;font-size:13px;background:#c0392b}
  #bye:hover{opacity:1}
  #info{display:none;position:fixed;left:8px;bottom:8px;z-index:5;max-width:min(520px,90vw);background:#000c;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div id="login">
  <h2>RemoteDesk</h2>
  <div class="tabs">
    <button id="tab-list" class="on">Meus computadores</button>
    <button id="tab-guest">Acesso avulso</button>
  </div>

  <div id="p-list" class="panel on">
    <div id="auth" class="panel on">
      <input id="tpw" type="password" placeholder="Senha do técnico">
      <button id="tlogin">Entrar</button>
    </div>
    <div id="comps" class="panel">
      <div class="top"><span class="sub" style="color:#888">Clique em Conectar</span><button class="ghost" id="tout">Sair</button></div>
      <div id="items" style="display:grid;gap:8px"></div>
    </div>
  </div>

  <div id="p-guest" class="panel">
    <input id="id" placeholder="ID" inputmode="numeric">
    <input id="pw" placeholder="Senha" type="password">
    <button id="go">Conectar</button>
  </div>
  <div id="err"></div>
</div>
<button id="bye">Desconectar</button>
<div id="info"></div>
<video id="screen" autoplay playsinline muted tabindex="0"></video>
<script>
const $ = s => document.querySelector(s);
const video = $("#screen");
let dc, ws, pc, token = null, listTimer = null;
try { token = localStorage.getItem("rd_token"); } catch {}
const saveToken = t => { token = t; try { t ? localStorage.setItem("rd_token", t) : localStorage.removeItem("rd_token"); } catch {} };
const setErr = m => $("#err").textContent = m || "";

// ---------- abas ----------
function tab(name) {
  $("#tab-list").classList.toggle("on", name === "list");
  $("#tab-guest").classList.toggle("on", name === "guest");
  $("#p-list").classList.toggle("on", name === "list");
  $("#p-guest").classList.toggle("on", name === "guest");
  setErr();
}
$("#tab-list").onclick = () => tab("list");
$("#tab-guest").onclick = () => tab("guest");

// ---------- lista do técnico ----------
const api = (path, opts = {}) => fetch(path, {
  ...opts,
  headers: {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})},
});

function showList(on) {
  $("#auth").classList.toggle("on", !on);
  $("#comps").classList.toggle("on", on);
  clearInterval(listTimer);
  if (on) { loadList(); listTimer = setInterval(loadList, 8000); }
}

async function loadList() {
  let r;
  try { r = await api("/api/computers"); } catch { return setErr("Sem conexão com o servidor"); }
  if (r.status === 401) { saveToken(null); return showList(false); }
  const list = await r.json();
  const box = $("#items");
  box.textContent = "";
  if (!list.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nenhum computador ainda. No programa do cliente, ative \"Acesso permanente\" e informe o código de ativação.";
    box.append(e);
  }
  for (const c of list) {
    const row = document.createElement("div"); row.className = "row";
    const dot = document.createElement("span"); dot.className = "dot" + (c.online ? " on" : "");
    const info = document.createElement("div"); info.className = "info";
    const name = document.createElement("div"); name.className = "name"; name.textContent = c.name;
    const sub = document.createElement("div"); sub.className = "sub";
    sub.textContent = `ID ${c.id} · ` + (c.online ? "online" : "offline desde " + new Date(c.lastSeen).toLocaleString("pt-BR"));
    info.append(name, sub);
    const go = document.createElement("button"); go.textContent = "Conectar"; go.disabled = !c.online;
    go.onclick = () => connect({id: c.id, token});
    const ren = document.createElement("button"); ren.className = "ghost"; ren.textContent = "✎"; ren.title = "Renomear";
    ren.onclick = async () => {
      const n = prompt("Novo nome:", c.name);
      if (n && n.trim()) { await api(`/api/computers/${c.id}/rename`, {method: "POST", body: JSON.stringify({name: n.trim()})}); loadList(); }
    };
    const del = document.createElement("button"); del.className = "ghost"; del.textContent = "✕"; del.title = "Remover da lista";
    del.onclick = async () => {
      if (confirm(`Remover "${c.name}" da lista?`)) { await api(`/api/computers/${c.id}`, {method: "DELETE"}); loadList(); }
    };
    row.append(dot, info, go, ren, del);
    box.append(row);
  }
}

$("#tlogin").onclick = async () => {
  setErr();
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: $("#tpw").value})});
    const d = await r.json();
    if (!r.ok) return setErr(d.error || "Erro ao entrar");
    saveToken(d.token); $("#tpw").value = ""; showList(true);
  } catch { setErr("Sem conexão com o servidor"); }
};
$("#tpw").addEventListener("keydown", e => e.key === "Enter" && $("#tlogin").click());
$("#tout").onclick = () => { saveToken(null); showList(false); };

// ---------- conexão ----------
$("#go").onclick = () => connect({id: $("#id").value.replace(/\D/g, ""), password: $("#pw").value.trim()});

const info = (msg, ms) => {
  const el = $("#info");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
  clearTimeout(info.t);
  if (msg && ms) info.t = setTimeout(() => el.style.display = "none", ms);
};
async function iceServers() {
  try { return await (await fetch("/api/ice")).json(); }
  catch { return [{urls: "stun:stun.l.google.com:19302"}]; }
}

let session = null; // { join, closedByUser, everConnected }

async function connect(join, existing) {
  const s = session = existing || {join, closedByUser: false, everConnected: false};
  if (!existing) setErr();
  const servers = await iceServers();
  if (session !== s || s.closedByUser) return;
  const mine = ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/viewer`);
  const myPc = pc = new RTCPeerConnection({iceServers: servers});
  dc = pc.createDataChannel("input");
  dc.onmessage = onRemoteMessage;
  pc.addTransceiver("video", {direction: "recvonly"});
  pc.ontrack = e => {
    s.everConnected = true;
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    $("#login").style.display = "none";
    video.style.display = "block";
    video.play().catch(() => info("Clique na tela para iniciar o vídeo"));
    $("#bye").style.display = "block";
    video.focus();
  };
  ws.onopen = () => ws.send(JSON.stringify({type: "join", ...join}));
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "denied") { s.closedByUser = true; setErr("O cliente recusou o acesso"); ws.close(); }
    else if (m.type === "error") {
      if (/expirada/.test(m.message)) s.closedByUser = true;  // sessão do técnico inválida: não adianta tentar de novo
      if (!s.everConnected) s.closedByUser = true;            // primeira tentativa falhou: volta ao login
      setErr(m.message);
      if (s.everConnected && !s.closedByUser) info(m.message + ". Tentando novamente...");
    }
    else if (m.type === "answer") { await pc.setRemoteDescription({type: "answer", sdp: m.sdp}); }
  };
  let dropTimer = null;
  pc.oniceconnectionstatechange = () => {
    if (myPc !== pc) return;
    const st = pc.iceConnectionState;
    clearTimeout(dropTimer);
    if (st === "checking" || st === "new") info("Conectando ao computador...");
    else if (st === "connected" || st === "completed") {
      info("Conectado. Aguardando a imagem...");
      setTimeout(() => {
        if (myPc !== pc) return;
        if (video.videoWidth > 0) return info("");
        pc.getStats().then(stats => {
          let pk = 0, dec = 0, codec = "?";
          const codecs = {};
          stats.forEach(x => { if (x.type === "codec") codecs[x.id] = x.mimeType; });
          stats.forEach(x => {
            if (x.type === "inbound-rtp" && x.kind === "video") {
              pk = x.packetsReceived || 0; dec = x.framesDecoded || 0; codec = codecs[x.codecId] || "?";
            }
          });
          info(`Conectado, mas sem imagem. Pacotes recebidos: ${pk} · quadros decodificados: ${dec} · codec: ${codec}. ` +
               `Navegador: ${navigator.userAgent.match(/(Chrome|Firefox|Safari|Edg)\/[\d.]+/g)?.slice(-1)[0] || "?"}`);
        });
      }, 6000);
    }
    else if (st === "disconnected") {
      info("Conexão instável...");
      dropTimer = setTimeout(() => ws.close(), 10000);  // não voltou: reinicia a sessão
    }
    else if (st === "failed") {
      if (s.everConnected) ws.close();
      else info("⚠ Não foi possível conectar diretamente a este computador (a rede dele bloqueia a conexão). É preciso configurar um servidor TURN.");
    }
  };
  pc.onicegatheringstatechange = () => {
    if (pc.iceGatheringState === "complete" && ws.readyState === 1)
      ws.send(JSON.stringify({type: "offer", sdp: pc.localDescription.sdp}));
  };
  ws.onclose = () => {
    if (mine !== ws) return;
    myPc.close();
    if (session === s && s.everConnected && !s.closedByUser) {
      info("Conexão perdida. Reconectando...");   // mantém a última imagem na tela e tenta de novo, sem limite
      setTimeout(() => connect(join, s), 2500);
      return;
    }
    session = null;
    video.style.display = "none"; $("#bye").style.display = "none"; info("");
    $("#login").style.display = "block";
    if (token) loadList();
  };
  pc.createOffer().then(o => pc.setLocalDescription(o));
}
$("#bye").onclick = () => { if (session) session.closedByUser = true; ws && ws.close(); };

showList(!!token);

// entrada: coordenadas normalizadas (0..1) relativas ao vídeo real, descontando as barras do object-fit
function norm(e) {
  const r = video.getBoundingClientRect(), vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(r.width / vw, r.height / vh);
  const w = vw * scale, h = vh * scale;
  const x = (e.clientX - r.left - (r.width - w) / 2) / w;
  const y = (e.clientY - r.top - (r.height - h) / 2) / h;
  return {x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y))};
}
video.addEventListener("click", () => video.paused && video.play());
const send = o => dc && dc.readyState === "open" && dc.send(JSON.stringify(o));
let lastMove = 0;
video.addEventListener("mousemove", e => {
  const n = performance.now(); if (n - lastMove < 30) return; lastMove = n;
  send({type: "move", ...norm(e)});
});
video.addEventListener("mousedown", e => { e.preventDefault(); send({type: "down", button: e.button, ...norm(e)}); });
video.addEventListener("mouseup", e => send({type: "up", button: e.button, ...norm(e)}));
video.addEventListener("contextmenu", e => e.preventDefault());
video.addEventListener("wheel", e => { e.preventDefault(); send({type: "scroll", dy: e.deltaY}); }, {passive: false});
// Cmd (Mac) funciona como Ctrl no computador remoto
const keyName = e => e.key === "Meta" ? "Control" : e.key;
const isPasteKey = e => (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v";
video.addEventListener("mousedown", () => video.focus());
video.addEventListener("keydown", e => {
  if (isPasteKey(e)) return;                       // o navegador dispara o evento "paste" (abaixo)
  e.preventDefault();
  send({type: "keydown", key: keyName(e)});
  // no Mac o navegador não envia keyup das teclas soltas enquanto Cmd está pressionado
  if (e.metaKey && e.key !== "Meta") send({type: "keyup", key: keyName(e)});
});
video.addEventListener("keyup", e => {
  if (isPasteKey(e)) return;
  e.preventDefault();
  if (e.metaKey && e.key !== "Meta") return;
  send({type: "keyup", key: keyName(e)});
});

// colar: o texto do SEU computador vai para a área de transferência do remoto e recebe Ctrl+V
document.addEventListener("paste", e => {
  if (video.style.display !== "block") return;
  e.preventDefault();
  const text = e.clipboardData && e.clipboardData.getData("text/plain");
  if (text) send({type: "paste", text});
});

// copiar: depois do Ctrl+C no remoto, o texto chega aqui e vai para a SUA área de transferência
let pendingClip = null;
function onRemoteMessage(ev) {
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.type !== "clipboard") return;
  navigator.clipboard.writeText(m.text).then(
    () => info("Texto copiado do computador remoto", 2500),
    () => { pendingClip = m.text; info("Clique na tela para concluir a cópia", 4000); });
}
video.addEventListener("click", () => {
  if (pendingClip === null) return;
  const t = pendingClip; pendingClip = null;
  navigator.clipboard.writeText(t).then(() => info("Texto copiado do computador remoto", 2500)).catch(() => {});
});

// toque (celular): dedo move o cursor, toque rápido clica, segurar clica com o botão direito,
// dois dedos rolam a página
let tStart = null, tMoved = false, tLong = false, tTimer = null, tMidY = null, tLast = 0;
video.addEventListener("touchstart", e => {
  e.preventDefault();
  clearTimeout(tTimer);
  if (e.touches.length === 2) {
    tMoved = true;
    tMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    return;
  }
  const t = e.touches[0];
  tStart = {x: t.clientX, y: t.clientY}; tMoved = false; tLong = false; tMidY = null;
  send({type: "move", ...norm(t)});
  tTimer = setTimeout(() => {
    if (tMoved) return;
    tLong = true;
    send({type: "down", button: 2, ...norm(t)});
    send({type: "up", button: 2, ...norm(t)});
  }, 600);
}, {passive: false});
video.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const mid = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (tMidY !== null) send({type: "scroll", dy: (tMidY - mid) * 4});
    tMidY = mid;
    return;
  }
  const t = e.touches[0];
  if (Math.hypot(t.clientX - tStart.x, t.clientY - tStart.y) > 8) { tMoved = true; clearTimeout(tTimer); }
  const n = performance.now(); if (n - tLast < 30) return; tLast = n;
  send({type: "move", ...norm(t)});
}, {passive: false});
video.addEventListener("touchend", e => {
  e.preventDefault();
  clearTimeout(tTimer);
  if (!tMoved && !tLong && e.touches.length === 0) {
    const n = norm(e.changedTouches[0]);
    send({type: "down", button: 0, ...n});
    send({type: "up", button: 0, ...n});
  }
}, {passive: false});
</script>
</body>
</html>
